header:
  version: 14

repos:
  # 本 repo（kas 檔案所在處），只用來提供 patch，不當 layer 加入
  kas-panda:
    layers:
      .: disabled

  # meta-raspberrypi 的 parselogs_rpi.py 還在用 oe-core 已移除的 API
  # （ignore_errors / common_errors，被 7a04063f7cf「load ignores from disk」拿掉）
  # 未修補的話 oeqa 的 test discovery 一定 ImportError，testimage 直接失敗。
  # 上游尚未修正（該檔最後一次改動是 5.10 核心時代）。
  meta-raspberrypi:
    patches:
      fix-parselogs:
        repo: kas-panda
        path: patches/meta-raspberrypi/0001-parselogs-rpi-drop-removed-oeqa-api.patch

local_conf_header:
  testimage: |
    IMAGE_CLASSES += "testimage"
    TEST_TARGET = "simpleremote"
    # ⚠️ DHCP 不再綁定 MAC，這個值每次開機都可能失效（見 docs/BOARD.md §5）
    TEST_TARGET_IP = "192.168.236.42"
    # 給板子反向連回主機用。WSL2 在 NAT 後面實際上連不到，
    # 但 testimage.bbclass:140 沒填會 bb.fatal，所以必須有值
    TEST_SERVER_IP = "172.24.73.233"
    # rtc_panda / tpm_panda 來自 meta-panda/lib/oeqa/runtime/cases/
    # ⚠️ 後綴 _panda 是為了避開 oe-core 既有的 rtc.py（模組名不能重複）
    TEST_SUITES = "ping ssh scp date df parselogs rtc_panda tpm_panda"
    # eltt2 = Infineon 的 TPM 測試工具，直接對 /dev/tpm0 下 TPM 2.0 命令。
    # 只在 CT 時需要，不是產品功能，所以裝在這裡而不是 panda.conf。
    IMAGE_INSTALL:append = " eltt2" 
