header:
  version: 14

repos:
  # 本 repo（kas 檔案所在處），只用來提供 patch，不當 layer 加入
  kas-panda:
    layers:
      .: disabled

  # meta-raspberrypi 的 parselogs_rpi.py 還在用 oe-core 已移除的 API
  # （ignore_errors / common_errors，被 7a04063f7cf「load ignores from disk」拿掉）
  # 未修補的話 oeqa 的 test discovery 一定 ImportError，testimage 直接失敗。
  # 上游尚未修正（該檔最後一次改動是 5.10 核心時代）。
  meta-raspberrypi:
    patches:
      fix-parselogs:
        repo: kas-panda
        path: patches/meta-raspberrypi/0001-parselogs-rpi-drop-removed-oeqa-api.patch

local_conf_header:
  # IMAGE_CLASSES  testimage 是 recipe 層級的 class，用 INHERIT 會掛到每個 recipe
  # TEST_TARGET_IP ⚠️ DHCP 不綁 MAC，每次開機都要改（docs/BOARD.md §5）
  # TEST_SERVER_IP 板子在 NAT 後面連不回來，但不填會 bb.fatal
  # TEST_SUITES    _panda 後綴是為了避開 oe-core 的同名模組（docs/GATES.md §3）
  # eltt2          TPM 測試工具，只有 CT 需要，所以不放 panda.conf
  testimage: |
    IMAGE_CLASSES += "testimage"
    TEST_TARGET = "simpleremote"
    TEST_TARGET_IP = "192.168.236.41"
    TEST_SERVER_IP = "172.24.73.233"
    TEST_SUITES = "ping ssh scp date df parselogs rtc_panda tpm_panda hardening_panda"
    IMAGE_INSTALL:append = " eltt2"
